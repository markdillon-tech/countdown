<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="Something is coming. 16 August 2026, 9:00 PM MYT." />

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  
  <title>Something Is Coming — 16.08.2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070707;
      --text: #f5f3ef;
      --muted: #9b9b9b;
      --red: #e30613;
      --line: rgba(255, 255, 255, .12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 75% 30%, rgba(227, 6, 19, .16), transparent 34%),
        radial-gradient(circle at 20% 85%, rgba(227, 6, 19, .08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      z-index: 20;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 28px clamp(22px, 4vw, 64px);
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: .25;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .orb {
      position: absolute;
      width: min(62vw, 820px);
      aspect-ratio: 1;
      right: -20vw;
      top: 2vh;
      border-radius: 50%;
      background: var(--red);
      filter: blur(140px);
      opacity: .13;
      z-index: -2;
      animation: breathe 6s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      from { transform: scale(.9); opacity: .08; }
      to { transform: scale(1.12); opacity: .17; }
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    header {
      font-family: "Barlow Condensed", sans-serif;
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: 12px;
      font-weight: 700;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 9px;
      height: 9px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(227, 6, 19, .85);
    }

    .status {
      color: var(--muted);
    }

    .status span {
      color: var(--text);
    }

    main {
      width: min(1320px, 100%);
      margin: auto;
      padding: clamp(70px, 10vh, 140px) 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--red);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(13px, 1.2vw, 17px);
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 2px;
      background: var(--red);
    }

    h1 {
      max-width: 1050px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(64px, 11vw, 170px);
      line-height: .78;
      letter-spacing: -.015em;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 .outline {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(245, 243, 239, .5);
    }

    .date-line {
      margin: clamp(28px, 5vh, 54px) 0 18px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(17px, 2vw, 28px);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .date-line strong {
      color: var(--red);
      font-weight: 800;
    }

    .countdown {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 18px;
    }

    .unit {
      position: relative;
      padding: clamp(18px, 3vw, 34px) clamp(8px, 2vw, 24px);
    }

    .unit:not(:last-child) {
      border-right: 1px solid var(--line);
    }

    .number {
      display: block;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(52px, 9vw, 126px);
      line-height: .88;
      font-weight: 800;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(9px, .9vw, 12px);
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .expired {
      display: none;
      margin-top: 28px;
      color: var(--red);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(46px, 7vw, 90px);
      font-weight: 900;
      text-transform: uppercase;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .socials {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .socials a {
      position: relative;
      color: var(--text);
      text-decoration: none;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: color .25s ease;
    }

    .socials a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: -5px;
      height: 2px;
      background: var(--red);
      transition: right .25s ease;
    }

    .socials a:hover {
      color: var(--red);
    }

    .socials a:hover::after {
      right: 0;
    }

    .corner {
      font-family: "Barlow Condensed", sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: right;
    }

    @media (max-width: 700px) {
      .page {
        padding: 22px 18px;
      }

      .status {
        display: none;
      }

      main {
        padding: 70px 0;
      }

      h1 {
        font-size: clamp(68px, 22vw, 120px);
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .unit:nth-child(2) {
        border-right: none;
      }

      .unit:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .unit {
        padding: 24px 12px;
      }

      .number {
        font-size: clamp(64px, 18vw, 92px);
      }

      footer {
        align-items: flex-end;
      }

      .socials {
        flex-direction: column;
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="grid"></div>
    <div class="orb"></div>

    <header>
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Mark Dillon / 2026</span>
      </div>

      <div class="status">
        Status — <span>Incoming</span>
      </div>
    </header>

    <main>
      <div class="eyebrow">A new chapter begins</div>

      <h1>
        Something
        <span class="outline">is coming.</span>
      </h1>

      <div class="date-line">
        16.08.2026 &nbsp;/&nbsp; <strong>21:00 MYT</strong>
      </div>

      <section class="countdown" id="countdown" aria-label="Countdown to 16 August 2026, 9 PM Malaysia time">
        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Days</span>
        </div>

        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Hours</span>
        </div>

        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>

        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>
      </section>

      <div class="expired" id="expired">We are live.</div>
    </main>

    <footer>
      <div class="socials">
        <a href="https://www.instagram.com/markdillon__/" target="_blank" rel="noopener noreferrer">
          Instagram ↗
        </a>
        <a href="https://www.facebook.com/itsmarkdillon" target="_blank" rel="noopener noreferrer">
          Facebook ↗
        </a>
      </div>

      <div class="corner">
        Kuala Lumpur<br>
        Malaysia
      </div>
    </footer>
  </div>

  <script>
    // Malaysia Time is UTC+8.
    // Target: 16 August 2026, 9:00 PM MYT.
    const target = new Date("2026-08-16T21:00:00+08:00").getTime();

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
      countdown: document.getElementById("countdown"),
      expired: document.getElementById("expired")
    };

    const pad = value => String(value).padStart(2, "0");

    function updateCountdown() {
      const now = Date.now();
      const distance = target - now;

      if (distance <= 0) {
        elements.countdown.style.display = "none";
        elements.expired.style.display = "block";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      elements.days.textContent = pad(days);
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
